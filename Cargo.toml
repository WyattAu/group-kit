[package]
name = "group-kit"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
description = "Multi-entity consolidation: intercompany matching that surfaces instead of guessing"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/group-kit"
keywords = ["accounting", "consolidation", "finance", "intercompany"]
categories = ["finance"]

[dependencies]
report-kit = "=0.2.3"
double-entry = "=0.1.1"
fx-kit = "=0.1.3"
vat-rules = "=0.1.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
